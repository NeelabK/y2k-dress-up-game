<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dress Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --hot: #e6238c; --pink: #ff8fc8; --pale: #ffd3ea; --ink: #7a1250; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #f7b6d9 repeating-linear-gradient(45deg, #f9c3e0 0 14px, #f7b6d9 14px 28px);
    font-family: Tahoma, Verdana, Geneva, sans-serif; color: var(--ink);
    display: grid; place-items: center; overflow: hidden; user-select: none;
  }
  /* The whole game is drawn on the 1536x1024 frame picture and scaled to fit the window */
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1536px; height: 1024px;
    background: url(assets/ui-frame.webp) 0 0 / 100% 100% no-repeat;
    overflow: hidden; overflow: clip; transform-origin: center center;
    box-shadow: 0 10px 40px rgba(122, 18, 80, .35);
  }

  /* ---------- title (empty bar at the top left of the frame) ---------- */
  #title {
    position: absolute; left: 30px; top: 22px; width: 500px; height: 64px;
    display: flex; align-items: center;
    font: 700 34px "Silkscreen", Tahoma, sans-serif; letter-spacing: 1px; color: #fff;
    text-shadow: 2px 0 0 var(--hot), -2px 0 0 var(--hot), 0 2px 0 var(--hot), 0 -2px 0 var(--hot), 3px 3px 0 #8fd0f5;
    white-space: nowrap; pointer-events: none;
  }

  /* ---------- the scene (big blue area of the frame) ---------- */
  #scene { position: absolute; left: 12px; top: 200px; width: 940px; height: 807px; overflow: hidden; overflow: clip; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .35s; }
  #bg.none { opacity: 0; }
  #floor-shadow { position: absolute; left: 50%; bottom: 10px; width: 300px; height: 30px; transform: translateX(-50%); background: radial-gradient(ellipse, rgba(0,0,0,.28), transparent 70%); }
  /* every doll layer is the same 971x1620 canvas stacked on top of each other */
  #doll { position: absolute; height: 780px; aspect-ratio: 971 / 1620; left: 50%; bottom: 12px; transform: translateX(-50%); filter: drop-shadow(0 8px 6px rgba(0,0,0,.22)); }
  #doll img, #doll canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #doll img.layer { animation: pop .3s ease-out; }
  #doll img.layer.settled { animation: none; }
  #doll img.layer.onbase { display: none; }
  @keyframes pop { 0% { transform: scale(1.04); opacity: .85; filter: brightness(1.6); } 100% { transform: none; opacity: 1; filter: none; } }
  #place-name {
    position: absolute; left: 14px; bottom: 12px; padding: 4px 10px; background: rgba(255,255,255,.8);
    border: 2px solid var(--hot); font: 700 15px "Silkscreen", Tahoma; color: var(--hot);
  }

  /* ---------- item tray (polka-dot area of the frame) ---------- */
  #tray {
    position: absolute; left: 966px; top: 292px; width: 520px; height: 634px; padding: 14px 16px 20px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 168px; gap: 12px; align-content: start;
    overflow-y: auto; scrollbar-width: none; scroll-behavior: smooth;
  }
  #tray::-webkit-scrollbar { display: none; }
  .section { grid-column: 1 / -1; height: 30px; align-self: center; margin: -2px 0 -6px; font: 700 20px "Silkscreen", Tahoma; color: #fff; text-shadow: 2px 2px 0 var(--hot), -1px -1px 0 var(--hot), 1px -1px 0 var(--hot), -1px 1px 0 var(--hot); }
  #tray .section { grid-row-end: span 1; }
  #tray { grid-auto-rows: auto; }
  .item {
    position: relative; height: 168px; cursor: pointer; background: rgba(255,255,255,.88);
    border: 3px solid #fff; outline: 2px solid #f9a8d4; border-radius: 12px; transition: transform .1s;
  }
  .item:hover { transform: translateY(-3px); outline-color: var(--hot); }
  .item.on { outline: 4px solid var(--hot); background: #fff; box-shadow: 0 0 0 7px rgba(230,35,140,.25); }
  .item.on::after { content: "ON"; position: absolute; top: 6px; right: 6px; padding: 1px 5px; background: var(--hot); color: #fff; font: 700 11px "Silkscreen", Tahoma; }
  .thumb { position: absolute; inset: 10px 10px 30px; background-repeat: no-repeat; }
  .item .lbl { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font: 700 13px Tahoma, Verdana, sans-serif; color: var(--ink); }

  /* ---------- invisible buttons sitting on top of the frame's own icons ---------- */
  /* working scrollbar: covers the pill painted on the frame and moves a copy of it */
  #bar { position: absolute; left: 1490px; top: 336px; width: 33px; height: 548px; background: #fcd0e9; cursor: pointer; touch-action: none; }
  #thumb { position: absolute; left: 2px; top: 0; width: 30px; height: 98px; cursor: grab; touch-action: none;
           background: url(assets/ui-frame.webp) -1492px -337px / 1536px 1024px no-repeat; }
  #thumb.drag { cursor: grabbing; }
  .hot { position: absolute; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 10px; }
  .hot:hover { background: rgba(255,255,255,.35); box-shadow: 0 0 0 2px rgba(230,35,140,.55); }
  .hot:active { background: rgba(230,35,140,.25); }
  .hot.round { border-radius: 50%; }
  .hot.round.active { box-shadow: 0 0 0 5px var(--hot), 0 0 14px 6px rgba(230,35,140,.5); }
  .hot.off::after { /* music switched off: red slash across the note */
    content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 5px; background: #e0143c; transform: rotate(45deg); border-radius: 3px;
  }
  /* old-school yellow tooltip */
  .hot[data-tip]:hover::before {
    content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); z-index: 30;
    background: #ffffe1; color: #000; border: 1px solid #000; padding: 3px 8px; font: 15px Tahoma, Verdana, sans-serif; white-space: nowrap;
    box-shadow: 2px 2px 0 rgba(0,0,0,.25); pointer-events: none;
  }
  .hot.tip-up[data-tip]:hover::before { top: auto; bottom: calc(100% + 6px); }
  .hot.tip-left[data-tip]:hover::before { left: auto; right: 0; transform: none; }

  /* ---------- little pink "window" used for the rating and the intro ---------- */
  .win { background: #ffe3f2; border: 3px solid var(--hot); box-shadow: 6px 6px 0 rgba(122,18,80,.3); }
  .win .bar { background: linear-gradient(90deg, var(--hot), #ff8fc8); color: #fff; font: 700 20px "Silkscreen", Tahoma; padding: 6px 12px; text-align: left; }
  .win .body { padding: 22px 26px 24px; text-align: center; font-size: 20px; }
  .btn {
    font: 700 20px "Silkscreen", Tahoma; color: #fff; cursor: pointer; padding: 9px 26px;
    background: linear-gradient(#ff8fc8, var(--hot)); border: 3px solid #fff; outline: 2px solid var(--hot); border-radius: 8px;
  }
  .btn:hover { filter: brightness(1.1); } .btn:active { transform: translateY(2px); }

  #rating { position: absolute; left: 482px; top: 400px; width: 520px; z-index: 40; transform: translate(-50%, -50%) scale(.7); left: 482px; opacity: 0; pointer-events: none; transition: all .2s; }
  #rating.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  #stars { font-size: 52px; letter-spacing: 6px; color: #ffc428; -webkit-text-stroke: 2px #c98a00; line-height: 1.1; }
  #stars .dim { color: #f6d3e4; -webkit-text-stroke: 2px #e6a9c9; }
  #rate-msg { margin: 12px 0 18px; }

  #toast { position: absolute; left: 482px; top: 214px; z-index: 45; transform: translate(-50%, -80px); background: #ffffe1; border: 1px solid #000; color: #000; padding: 6px 14px; font-size: 18px; box-shadow: 3px 3px 0 rgba(0,0,0,.25); transition: transform .25s; white-space: nowrap; }
  #toast.show { transform: translate(-50%, 0); }

  #intro { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(255, 190, 225, .82); transition: opacity .4s; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .win { width: 560px; }
  #intro h1 { font: 700 44px "Silkscreen", Tahoma; color: var(--hot); margin: 0 0 6px; }
  #intro p { margin: 0 0 20px; }
  #loadbar { width: 360px; height: 24px; margin: 0 auto; border: 3px solid var(--hot); background: #fff; }
  #loadfill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--hot) 0 14px, #fff 14px 18px); transition: width .2s; }
  #playbtn { display: none; font-size: 30px; padding: 12px 54px; }

  /* sparkles: drawn shapes, no text symbols */
  .spark { position: absolute; z-index: 50; width: 18px; height: 18px; pointer-events: none; background: #fff;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    filter: drop-shadow(0 0 3px #ff5fb4); animation: spark .7s ease-out forwards; }
  .spark.p { background: #ff7ac1; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2) rotate(120deg); opacity: 0; } }

</style>
</head>

  <button class="hot tip-up tip-left" id="nextPlace" style="left:1460px; top:940px; width:56px; height:50px" data-tip="Next place"></button>

  <div id="rating" class="win">

    <div class="body">
      <div id="stars"></div>
      <div id="rate-msg"></div>
      <button class="btn" id="rateClose">OK</button>

  </div>
  <div id="toast"></div>

  <div id="intro">

      <div class="bar">Loading...</div>
      <div class="body">

        <div id="loadbar"><div id="loadfill"></div></div>
        <button class="btn" id="playbtn">PLAY</button>
      </div>
    </div>
  </div>
</div>

/* ===================== STATE ===================== */
const worn = {};               // slot -> item id
let currentCat = "tops";
let currentBg = "studio";

const $ = s => document.querySelector(s);
const doll = $("#doll"), tray = $("#tray"), stage = $("#stage");
$("#title").textContent = $("#introTitle").textContent = document.title = GAME_TITLE;

/* ===================== SOUND EFFECTS (tiny synth, no files needed) ===================== */
let actx;
function chime(notes, type = "triangle") {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.07;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.35);
    });
  } catch (e) {}
}
const sfx = {
  on:    () => chime([988, 1319, 1760]),
  off:   () => chime([660, 440], "sine"),
  click: () => chime([1200], "square"),
  magic: () => chime([784, 988, 1175, 1568, 1976]),
};

/* ===================== BACKGROUND MUSIC (the MP3 in assets, looped) ===================== */
let musicOn = true, musicStarted = false, musicBroken = false;
const music = new Audio(MUSIC_FILE);
music.loop = true; music.preload = "auto"; music.volume = MUSIC_VOLUME / 100;
music.onerror = () => { musicBroken = true; $("#musicBtn").classList.add("off"); };
function playMusic() { music.play().catch(() => {}); }
function startMusic() { musicStarted = true; if (musicOn && !musicBroken) playMusic(); }
function toggleMusic() {
  if (musicBroken) { toast("The song could not be played here"); return; }
  musicOn = !musicOn; $("#musicBtn").classList.toggle("off", !musicOn);
  if (musicStarted) { musicOn ? playMusic() : music.pause(); }
  toast(musicOn ? "Music on" : "Music off");
}


/* ===================== THE DOLL ===================== */
/* She is painted on a canvas so parts of her can be erased (feet inside boots,
   legs inside jeans) and her tank / shorts hidden under clothes. */
const baseCanvas = $("#base"), bctx = baseCanvas.getContext("2d");
const dollImg = new Image(), patchImg = new Image(), tankPatchImg = new Image();
dollImg.onload = patchImg.onload = tankPatchImg.onload = () => drawBase();
dollImg.src = "assets/doll.png"; patchImg.src = "assets/body-noshorts.png"; tankPatchImg.src = "assets/body-notank.png";

function drawBase() {
  bctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  if (!dollImg.naturalWidth) return;
  bctx.drawImage(dollImg, 0, 0, CANVAS_W, CANVAS_H);
  // only change her body once the item's own picture is on screen, so she is never shown half-dressed
  const ready = id => { const im = doll.querySelector(`img[data-key="${id}"]`); return im && im.complete && im.naturalWidth; };
  const on = Object.values(worn).filter(ready);
  if (worn.bottom && ready(worn.bottom) && patchImg.naturalWidth) bctx.drawImage(patchImg, 0, 0, CANVAS_W, CANVAS_H);
  if (on.some(id => itemById(id).hideTank) && tankPatchImg.naturalWidth) bctx.drawImage(tankPatchImg, 0, 0, CANVAS_W, CANVAS_H);
  // tights are painted straight onto her legs, so boots and jeans can erase them along with the legs
  if (worn.tights && ready(worn.tights)) bctx.drawImage(doll.querySelector(`img[data-key="${worn.tights}"]`), 0, 0, CANVAS_W, CANVAS_H);
  for (const id of on) {
    const h = itemById(id).hide;
    if (h) bctx.clearRect(h[0], h[1], h[2] - h[0], h[3] - h[1]);
  }
}

function renderDoll() {
  const stale = new Set(doll.querySelectorAll("img.layer"));
  const clip = Object.values(worn).map(id => itemById(id).clip).find(Boolean) || "";
  const place = (key, src, behind, slot) => {
    let img = doll.querySelector(`img[data-key="${key}"]`);
    if (img) stale.delete(img);
    else {
      img = new Image(); img.className = "layer"; img.dataset.key = key; img.src = src; img.alt = "";
      img.addEventListener("animationend", () => img.classList.add("settled"));
      img.addEventListener("load", drawBase);
    }
    const mask = clip && ["top", "dress", "bottom"].includes(slot) ? `url(${clip})` : "";
    img.style.webkitMaskImage = img.style.maskImage = mask;
    img.style.webkitMaskSize = img.style.maskSize = "100% 100%";
    img.dataset.clip = mask ? clip : "";
    img.classList.toggle("onbase", slot === "tights");
    if (behind) doll.insertBefore(img, baseCanvas); else doll.appendChild(img);  // moves existing nodes into order
  };
  const order = Object.entries(worn).sort((a, b) => SLOTS[a[0]] - SLOTS[b[0]]).map(([, id]) => itemById(id));
  order.filter(it => it.backSrc).forEach(it => place(it.id + "-back", it.backSrc, true));
  order.forEach(it => place(it.id, it.src, false, it.slot));
  stale.forEach(n => n.remove());
  drawBase();
}

/* ===================== CLOSET ===================== */
function renderCats() {
  document.querySelectorAll(".cat").forEach(b => b.classList.toggle("active", b.dataset.cat === currentCat));
}

function renderTray(keepScroll) {
  const top = tray.scrollTop;
  const groups = CATEGORIES[currentCat].map(([slot, label]) => [label, ITEMS.filter(i => i.slot === slot)]).filter(g => g[1].length);
  tray.innerHTML = groups.map(([label, items]) =>
    (groups.length > 1 ? `<div class="section">${label}</div>` : "") +
    items.map(i => `
      <div class="item ${worn[i.slot] === i.id ? "on" : ""}" data-item="${i.id}">
        <div class="thumb" data-box="${i.box.join(",")}" style="background-image:url(${i.thumb || i.src})"></div>
        <div class="lbl">${i.name}</div>
      </div>`).join("")
  ).join("");
  tray.querySelectorAll(".thumb").forEach(t => {            // zoom each picture onto the item itself
    const [x, y, w, h] = t.dataset.box.split(",").map(Number);
    const r = { w: t.clientWidth, h: t.clientHeight }, s = Math.min(r.w / w, r.h / h) * 0.94;
    t.style.backgroundSize = `${CANVAS_W * s}px ${CANVAS_H * s}px`;
    t.style.backgroundPosition = `${(r.w - w * s) / 2 - x * s}px ${(r.h - h * s) / 2 - y * s}px`;
  });
  tray.style.scrollBehavior = "auto"; tray.scrollTop = keepScroll ? top : 0; tray.style.scrollBehavior = "";
  if (typeof syncBar === "function") syncBar();
}

function setBg(id) {
  currentBg = id;
  const b = BACKGROUNDS.find(x => x.id === id), img = $("#bg");
  if (b.src) { img.src = b.src; img.classList.remove("none"); } else img.classList.add("none");
  $("#place-name").textContent = b.name;
}
function stepBg(d) {
  const i = BACKGROUNDS.findIndex(b => b.id === currentBg);
  setBg(BACKGROUNDS[(i + d + BACKGROUNDS.length) % BACKGROUNDS.length].id); sfx.on();
}

/* ===================== ACTIONS ===================== */
function toggleItem(id) {
  const it = itemById(id);
  if (worn[it.slot] === id) { delete worn[it.slot]; sfx.off(); }
  else {
    worn[it.slot] = id;
    if (it.slot === "dress") { delete worn.top; delete worn.bottom; }      // a dress replaces a top + bottom, and vice versa
    if (it.slot === "top" || it.slot === "bottom") delete worn.dress;
    sfx.on();
  }
  renderDoll(); renderTray(true);
}

function clearAll() { Object.keys(worn).forEach(k => delete worn[k]); }

function randomize() {
  clearAll();
  const pick = slot => { const a = ITEMS.filter(i => i.slot === slot); return a.length ? a[Math.floor(Math.random() * a.length)].id : null; };
  const put = (slot, chance = 1) => { const id = Math.random() < chance ? pick(slot) : null; if (id) worn[slot] = id; };
  if (Math.random() < 0.2) put("dress"); else { put("top"); put("bottom"); }
  put("tights", 0.2); put("shoes"); put("necklace", 0.4); put("earrings", 0.4); put("bag", 0.6); put("coat", 0.3); put("eyes", 0.4);
  setBg(BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)].id);
  sfx.magic(); burstAtDoll(20);
  renderDoll(); renderTray(true);
}

function rateLook() {
  const n = Object.keys(worn).length;
  let score = n === 0 ? 0 : Math.min(4, Math.ceil(n * 0.8));
  if ((worn.top && worn.bottom) || worn.dress) score = Math.max(score, 2);
  const stars = score + 1;
  $("#stars").innerHTML = "★".repeat(stars) + `<span class="dim">${"★".repeat(5 - stars)}</span>`;
  $("#rate-msg").innerHTML = `<b>${COMPLIMENTS[score][0]}</b><br>${COMPLIMENTS[score][1]}`;
  $("#rating").classList.add("show");
  sfx.magic(); if (stars >= 4) burstAtDoll(26);
}

function saveLook() {
  try { localStorage.setItem("dressup-look", JSON.stringify({ worn, bg: currentBg })); toast("Look saved"); sfx.magic(); }
  catch (e) { toast("This browser would not let me save"); }
}
function loadLook() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem("dressup-look")); } catch (e) {}
  if (!d) { toast("No saved look yet - use the disk to save one"); return; }
  clearAll();
  Object.entries(d.worn || {}).forEach(([slot, id]) => { if (itemById(id)) worn[slot] = id; });
  if (BACKGROUNDS.some(b => b.id === d.bg)) setBg(d.bg);
  renderDoll(); renderTray(true); toast("Saved look opened"); sfx.magic(); burstAtDoll(16);
}

async function savePhoto() {
  const [fx, fy, W, H] = FRAME.scene;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  try {
    const b = BACKGROUNDS.find(b => b.id === currentBg);
    if (b.src) {
      const bg = await load(b.src), s = Math.max(W / bg.width, H / bg.height);
      x.drawImage(bg, (W - bg.width * s) / 2, (H - bg.height * s) / 2, bg.width * s, bg.height * s);
    } else x.drawImage(await load(FRAME.src), fx, fy, W, H, 0, 0, W, H);       // the frame's own backdrop
    const dh = 780, dw = dh * CANVAS_W / CANVAS_H, dx = (W - dw) / 2, dy = H - dh - 12;
    for (const el of doll.children) {             // back layers, doll canvas, clothes - in order
      if (el.classList.contains("onbase")) continue;   // already painted on the doll canvas
      let src = el;
      if (el.dataset && el.dataset.clip) {         // tucked-in layer: cut it to the coat silhouette first
        const t = document.createElement("canvas"); t.width = CANVAS_W; t.height = CANVAS_H;
        const tx = t.getContext("2d"); tx.drawImage(el, 0, 0, CANVAS_W, CANVAS_H);
        tx.globalCompositeOperation = "destination-in"; tx.drawImage(await load(el.dataset.clip), 0, 0, CANVAS_W, CANVAS_H);
        src = t;
      }
      x.drawImage(src, dx, dy, dw, dh);
    }
    const a = document.createElement("a");
    a.download = "my-look.png"; a.href = c.toDataURL("image/png"); a.click();
    toast("Photo saved"); sfx.magic();
  } catch (e) {
    toast("Photos only work when the game is opened from a web address");
  }
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ===================== SPARKLES ===================== */
function stagePoint(clientX, clientY) {
  const r = stage.getBoundingClientRect(), k = r.width / stage.offsetWidth;
  return [(clientX - r.left) / k, (clientY - r.top) / k];
}
function burst(px, py, n = 8) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div"); s.className = "spark" + (i % 2 ? " p" : "");
    const ang = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90, size = 12 + Math.random() * 18;
    s.style.left = px - size / 2 + "px"; s.style.top = py - size / 2 + "px"; s.style.width = s.style.height = size + "px";
    s.style.setProperty("--dx", Math.cos(ang) * d + "px"); s.style.setProperty("--dy", Math.sin(ang) * d + "px");
    stage.appendChild(s); setTimeout(() => s.remove(), 750);
  }
}
function burstAtDoll(n) {
  const r = doll.getBoundingClientRect();
  for (let i = 0; i < 4; i++) {
    const [px, py] = stagePoint(r.left + Math.random() * r.width, r.top + Math.random() * r.height);
    burst(px, py, Math.ceil(n / 4));
  }
}

/* ===================== EVENTS ===================== */
document.querySelectorAll(".cat").forEach(b => b.onclick = () => { currentCat = b.dataset.cat; sfx.click(); renderCats(); renderTray(); });
tray.addEventListener("click", e => { const it = e.target.closest(".item"); if (it) toggleItem(it.dataset.item); });
$("#placeBtn").onclick = $("#nextPlace").onclick = () => stepBg(1);
$("#prevPlace").onclick = () => stepBg(-1);
$("#randBtn").onclick = randomize;
$("#resetBtn").onclick = $("#newBtn").onclick = () => { clearAll(); sfx.off(); renderDoll(); renderTray(true); };
$("#rateBtn").onclick = rateLook;
$("#rateClose").onclick = () => { $("#rating").classList.remove("show"); sfx.click(); };
$("#photoBtn").onclick = savePhoto;
$("#saveBtn").onclick = saveLook;
$("#loadBtn").onclick = loadLook;
$("#musicBtn").onclick = toggleMusic;
$("#upBtn").onclick = () => tray.scrollBy({ top: -340 });
$("#downBtn").onclick = () => tray.scrollBy({ top: 340 });

/* the pink pill: drag it, or click the track above / below it */
const bar = $("#bar"), thumb = $("#thumb");
const barRoom = () => bar.clientHeight - thumb.offsetHeight, trayRoom = () => tray.scrollHeight - tray.clientHeight;
function syncBar() { thumb.style.top = (trayRoom() > 0 ? tray.scrollTop / trayRoom() * barRoom() : 0) + "px"; }
tray.addEventListener("scroll", syncBar);
let grab = null;
thumb.addEventListener("pointerdown", e => {
  grab = { y: e.clientY, top: tray.scrollTop }; thumb.setPointerCapture(e.pointerId); thumb.classList.add("drag"); e.preventDefault(); e.stopPropagation();
});
thumb.addEventListener("pointermove", e => {
  if (!grab) return;
  const scale = bar.getBoundingClientRect().height / bar.clientHeight;      // the stage is scaled to fit the window
  tray.style.scrollBehavior = "auto";
  tray.scrollTop = grab.top + (e.clientY - grab.y) / scale / barRoom() * trayRoom();
  tray.style.scrollBehavior = "";
});
const drop = () => { grab = null; thumb.classList.remove("drag"); };
thumb.addEventListener("pointerup", drop); thumb.addEventListener("pointercancel", drop);
bar.addEventListener("pointerdown", e => {
  if (e.target !== bar) return;
  tray.scrollBy({ top: e.clientY < thumb.getBoundingClientRect().top ? -340 : 340 });
});
stage.addEventListener("pointerdown", e => { const [x, y] = stagePoint(e.clientX, e.clientY); burst(x, y, 6); });

/* scale the fixed-size frame to fit any window, like an embedded Flash movie */
function fit() { stage.style.transform = `translate(-50%, -50%) scale(${Math.min(innerWidth / 1560, innerHeight / 1044)})`; }
addEventListener("resize", fit); fit();

/* ===================== PRELOADER ===================== */
(function preload() {
  const srcs = [FRAME.src, "assets/doll.png", "assets/body-noshorts.png", "assets/body-notank.png",
    ...ITEMS.flatMap(i => [i.src, i.backSrc, i.clip, i.thumb].filter(Boolean)), ...BACKGROUNDS.filter(b => b.src).map(b => b.src)];
  let done = 0;
  srcs.forEach(src => {
    const i = new Image();
    i.onload = i.onerror = () => {
      done++; $("#loadfill").style.width = (done / srcs.length * 100) + "%";
      if (done === srcs.length) { $("#loadbar").style.display = "none"; $("#playbtn").style.display = "inline-block"; $("#intro .bar").textContent = "Ready"; }
    };
    i.src = src;
  });
})();
$("#playbtn").onclick = () => { $("#intro").classList.add("gone"); sfx.magic(); startMusic(); setTimeout(() => burstAtDoll(20), 200); };

renderCats(); setBg("studio"); renderTray(); renderDoll();
</script>
</body>
</html>
